<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{.Title}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f6fb;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f4f6fb" style="background-color:#f4f6fb;">
<tr>
<td align="center" style="padding:32px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;font-family:Arial,Helvetica,sans-serif;">
<tr>
<td bgcolor="#183EF6" style="background-color:#183EF6;padding:18px 22px;border-radius:10px 10px 0 0;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0">
<tr>
{{- if .LogoURL}}
<td style="vertical-align:middle;padding-right:12px;">
<img src="{{.LogoURL}}" width="36" height="36" alt="Bright.Blue" style="display:block;border:0;outline:none;text-decoration:none;">
</td>
{{- end}}
<td style="vertical-align:middle;font-family:Arial,Helvetica,sans-serif;font-size:20px;line-height:24px;font-weight:700;color:#ffffff;">Bright.Watch</td>
</tr>
</table>
</td>
</tr>
<tr>
<td bgcolor="#ffffff" class="content" style="background-color:#ffffff;border:1px solid #d9e2f2;border-top:0;border-radius:0 0 10px 10px;padding:28px 28px 32px;font-family:Arial,Helvetica,sans-serif;">
<h1 style="margin:0 0 16px;font-family:Arial,Helvetica,sans-serif;font-size:20px;line-height:1.35;font-weight:700;color:#12233f;">{{.Title}}</h1>
{{block "content" .}}{{end}}
</td>
</tr>
<tr>
<td style="padding:16px 4px 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#5c6b86;">
Bright.Watch by Bright.Blue{{block "footerExtra" .}}{{end}}
</td>
</tr>
</table>
</td>
</tr>
</table>
</body>
</html>
