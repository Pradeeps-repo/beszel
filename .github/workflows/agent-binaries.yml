# Static beszel-agent binaries for the systemd fleet.
# Assets stay at a fixed tag so upgrade scripts can use one URL:
#   https://github.com/Pradeeps-repo/beszel/releases/download/agent-latest/beszel-agent_linux_amd64
#   https://github.com/Pradeeps-repo/beszel/releases/download/agent-latest/beszel-agent_linux_amd64.sha256
name: Publish agent binaries

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-upgrade-script:
    name: upgrade script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Syntax and unit checks
        run: |
          bash -n scripts/upgrade-agent.sh
          bash scripts/upgrade-agent_test.sh

  build:
    name: ${{ matrix.asset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            goarm: ""
            asset: beszel-agent_linux_amd64
          - goarch: arm64
            goarm: ""
            asset: beszel-agent_linux_arm64
          - goarch: arm
            goarm: "7"
            asset: beszel-agent_linux_armv7
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build static agent
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/${{ matrix.asset }}" ./internal/cmd/agent
          (cd dist && sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256")
          # The checksum file is the contract scripts/upgrade-agent.sh verifies.
          (cd dist && sha256sum -c "${{ matrix.asset }}.sha256")

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          if-no-files-found: error
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256

  publish:
    name: publish agent-latest
    needs: [build, test-upgrade-script]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh release --target runs git. The download-only job is not a repository
      # until this checkout, which is why the first publish failed.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: beszel-agent_linux_*
          merge-multiple: true

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=agent-latest
          notes="Rolling static agent build from ${GITHUB_SHA}.

          Assets (replaced on every push to main):
          - beszel-agent_linux_amd64
          - beszel-agent_linux_arm64
          - beszel-agent_linux_armv7

          Each binary has a sibling .sha256 file (sha256sum format)."
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release edit "$tag" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "beszel-agent latest" --notes "$notes"
          else
            gh release create "$tag" --repo "$GH_REPO" \
              --target "$GITHUB_SHA" \
              --title "beszel-agent latest" \
              --notes "$notes" \
              --latest=false
          fi
          gh release upload "$tag" dist/* --clobber --repo "$GH_REPO"
