# Builds this fork's hub and agent and pushes them to GHCR.
# Hub:  ghcr.io/<owner>/beszel
# Agent: ghcr.io/<owner>/beszel-agent (Alpine image, includes ddcutil)
name: Publish GHCR images

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hub
            image: beszel
            dockerfile: ./internal/dockerfile_hub
            site: true
          - name: agent
            image: beszel-agent
            dockerfile: ./internal/dockerfile_agent_alpine
            site: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up bun
        if: matrix.site
        uses: oven-sh/setup-bun@v2

      - name: Build site
        if: matrix.site
        run: |
          bun install --no-save --cwd ./internal/site
          bun run --cwd ./internal/site build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          # latest is added explicitly so branch pushes and version tags both get it.
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=,enable=${{ github.ref_type == 'branch' }}
            type=raw,value=${{ github.ref_name }},enable=${{ github.ref_type == 'tag' }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp version
        id: version
        run: |
          base="$(awk -F'"' '/^[[:space:]]*Version = /{print $2; exit}' beszel.go)"
          short="${GITHUB_SHA::7}"
          echo "version=${base}-bw.${GITHUB_RUN_NUMBER}+${short}" >> "$GITHUB_OUTPUT"
          echo "commit=${short}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BESZEL_VERSION=${{ steps.version.outputs.version }}
            BESZEL_COMMIT=${{ steps.version.outputs.commit }}
